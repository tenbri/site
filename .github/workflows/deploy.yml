name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # main → production; pull requests → a preview version with its own URL
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            npx -y wrangler@4.151.2 deploy
          else
            npx -y wrangler@4.151.2 versions upload --preview-alias "pr-$PR" | tee out.txt
            echo "url=$(grep -oE 'https://pr-[^ ]+workers\.dev' out.txt | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Preview: ${process.env.URL}`,
            });
